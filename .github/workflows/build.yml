name: Build OPPO Live Viewer

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # Apple Silicon（用户仅有 ARM Mac）
            args: "--target aarch64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux 依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 安装前端依赖
        run: npm install

      - name: 构建并上传安装包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: "OPPO Live Viewer v__VERSION__"
          releaseBody: "各平台安装包：\n- Windows: .msi / .exe (NSIS)\n- macOS: .dmg（Apple Silicon aarch64）\n- Linux: .deb / .AppImage"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # 绿色版：Tauri 把前端资源嵌入 exe，原始 release exe 双击即可直接运行，
      # 无需安装向导（仅需系统自带的 WebView2 运行时）。
      - name: 复制绿色版 Windows exe
        if: matrix.platform == 'windows-latest'
        run: |
          mkdir -p portable
          cp src-tauri/target/release/oppo-live-viewer-tauri.exe portable/OPPO-Live-Viewer-portable-x64.exe

      - name: 上传安装包到 Actions Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.app.tar.gz
            portable/**
          if-no-files-found: warn
